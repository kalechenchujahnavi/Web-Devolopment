<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /*1.Element selector */
        p{
            color:rgb(225, 21, 31);
        }

        /*2.class selector */
        .highlight {
            color:rgb(220, 20, 170);
            background-color: honeydew;
        }

        /* 3. ID selector*/
        #special {
            color:deepskyblue;
            font-size: 25px;
        }
    </style>
</head>
<body>
    

    <h1>CSS Selector</h1>

    <!--Element Selector-->
     <p>My self K.Jahnavi</p>
     <p>Iam from Venkatagiri</p>

    <!--Class Selector-->
    <p class="highlight">This is highlighted text.</p>
    <h2 class="highlight">This heading also uses the class.</h2>

    <!--ID Selector-->
    <p id="special">This is special</p>
    
</body>
</html>
