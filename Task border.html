<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border CSS</title>
    
    <style>
        h1 {
            border: 3px solid purple;
        }

        .profile {
            border: 3px solid pink;
            padding: 30px;
            border-radius: 20px;
        }

        .skills {
            border:3px dashed black;
            padding: 30px;
            border-radius:20px;
        }

        h2 { 
            border: 2px dotted  blueviolet;
            text-align: center;
        
        }

    </style>
</head>
<body>
    <h1 align="center">Self Intro</h1>

    <div class="profile">
        <h2>Profile</h2>
        <ol>
        <li>My self K.Jahnavi</li>
        <li>Iam a Btech CSE student</li>
        <li>Iam a strong girl</li>
        </ol>
    </div><br>

    
         <div class="skills">
        <h2>My Skills</h2>
        <ul>
            <li>Basic level of Web development</li>
            <li>Basic level of python</li>
            <li>I love to Dance</li>
        </ul>
    </div>
</body>
</html>
