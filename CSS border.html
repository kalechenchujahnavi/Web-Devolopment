<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p {
        border: solid;
         color:rgb(24, 2, 14);
    }

    h1 {
                    color: rgb(44, 23, 234);
            text-align: center;
            font-size: 40px
    }

    .box1 {
          border: 3px dashed black;    
          border-radius: 15px;
    }

    .box2 {
        border: 3px dotted rgb(218, 42, 42);
        border-radius: 15px;
    } 

    .box3 {
        border: 3px double darkblue;
        border-radius: 16px;
    }

    .box4 {
        border: 3px solid darkmagenta;
        border-radius: 20px;

    }
</style>
<body>
    <h1>CSS Borders</h1>

    <p>This paragraph has a solid border.</p>

    <p class="box1">This is a dashed border.</p>

    <p class="box2">This is a dotted border.</p>

    <p class="box3">This is a double border.</p>

    <p class="box4">This is a rounded border.</p>
</body>
</html>
