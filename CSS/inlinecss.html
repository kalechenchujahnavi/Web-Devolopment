<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color:rgb(162, 18, 18); text-align:center;">
        My website
    </h1>

    <!--The style is applied directly to this paragraph-->
    <p style="color:black; font-size: 20px;">
        This is an example of Inline CSS.
    </p>

    <!--Another element with its own style -->
    <button style="background-color:black;color:bisque">
        Click Me
    </button>
</body>
</html>
